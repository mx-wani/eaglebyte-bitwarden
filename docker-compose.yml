# Deployed by Coolify (Docker Compose build pack). Coolify's proxy terminates
# HTTPS for the domain set on the vaultwarden service and forwards to port 80.
# Settings below are Coolify environment variables; defaults apply until changed.
services:
  vaultwarden:
    # Upgrade by bumping this tag and pushing; Coolify redeploys.
    image: vaultwarden/server:1.37.4
    restart: unless-stopped
    environment:
      - SERVICE_URL_VAULTWARDEN
      - DOMAIN=${SERVICE_URL_VAULTWARDEN}
      # Argon2id hash from scripts/admin-token.sh. Set Interpolation to Literal in Coolify.
      - ADMIN_TOKEN=${ADMIN_TOKEN:?}
      - SIGNUPS_ALLOWED=${SIGNUPS_ALLOWED:-false}
      - INVITATIONS_ALLOWED=${INVITATIONS_ALLOWED:-true}
      - INVITATION_ORG_NAME=${INVITATION_ORG_NAME:-EagleByte Vault}
      - SHOW_PASSWORD_HINT=false
      # Mobile push: get an installation ID and key at https://bitwarden.com/host/
      - PUSH_ENABLED=${PUSH_ENABLED:-false}
      - PUSH_INSTALLATION_ID=${PUSH_INSTALLATION_ID}
      - PUSH_INSTALLATION_KEY=${PUSH_INSTALLATION_KEY}
      - PUSH_RELAY_URI=${PUSH_RELAY_URI:-https://push.bitwarden.com}
      - PUSH_IDENTITY_URI=${PUSH_IDENTITY_URI:-https://identity.bitwarden.com}
      # Email: Vaultwarden refuses to start when SMTP_HOST/SMTP_FROM are set but
      # empty, so uncomment these only together with real values.
      # - SMTP_HOST=${SMTP_HOST:?}
      # - SMTP_FROM=${SMTP_FROM:?}
      # - SMTP_FROM_NAME=${SMTP_FROM_NAME:-EagleByte Vault}
      # - SMTP_PORT=${SMTP_PORT:-587}
      # - SMTP_SECURITY=${SMTP_SECURITY:-starttls}
      # - SMTP_USERNAME=${SMTP_USERNAME:?}
      # - SMTP_PASSWORD=${SMTP_PASSWORD:?}
      - IP_HEADER=X-Forwarded-For
      - LOG_FILE=/data/vaultwarden.log # read by host/fail2ban
      - TZ=${TZ:-UTC}
    volumes:
      - vaultwarden-data:/data
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g

volumes:
  vaultwarden-data:
